<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liiga-Koosteet Automaatilla</title>
    <style>
        :root {
            --primary: #002f6c;
            --accent: #ff6b00;
            --bg: #f4f7f6;
            --text: #333;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .header { background-color: var(--primary); color: white; text-align: center; padding: 30px 20px; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .kortti { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 25px; margin-bottom: 30px; border-top: 5px solid var(--accent); }
        .kortti h2 { margin-top: 0; color: var(--primary); }
        .nappi { display: inline-block; background-color: var(--accent); color: white; text-decoration: none; padding: 10px 15px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; margin-right: 10px; cursor: pointer; border: none; font-size: 0.9rem; }
        .nappi.some-nappi { background-color: #111; }
        .tekstilaatikko { background: #f9fbfb; border-left: 4px solid var(--primary); padding: 15px; border-radius: 4px; white-space: pre-wrap; margin-bottom: 15px; font-size: 1rem; }
        .some-laatikko { border-left-color: #ff0050; background: #fff5f7; font-style: italic; }
        #lataus { text-align: center; font-size: 1.2rem; color: #666; margin-top: 50px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🏒 Liiga Tekoäly-Selostaja & Somettaja</h1>
        <p>Äänitysvalmiit radioselostukset ja kopioitavat somepostaukset sekunneissa</p>
    </div>

    <div class="container">
        <div id="lataus">Ladataan uusimpia materiaaleja...</div>
        <div id="sisalto"></div>
    </div>

    <script>
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('lataus').style.display = 'none';
                const container = document.getElementById('sisalto');
                
                data.forEach((leike, index) => {
                    // KORJATTU: Jos data.json on vanha eikä 'some' kenttää ole, luodaan automaattinen varateksti
                    let lopullinenSome = leike.some;
                    if (!lopullinenSome || lopullinenSome === "undefined") {
                        lopullinenSome = `🏒 UUTTA MATERIAALIA LIIGAN KANAVALTA! 🔥 Uunituore video julkaistu otsikolla: ${leike.otsikko}! 🚨 Tsekkaa täysi selostus nettisivuiltamme ja ota kooste haltuun suoraan linkistä! 📺👇 ${leike.url} #Liiga #Jääkiekko #Kooste`;
                    }

                    const div = document.createElement('div');
                    div.className = 'kortti';
                    div.innerHTML = `
                        <h2>${leike.otsikko}</h2>
                        <a href="${leike.url}" target="_blank" class="nappi">📺 Katso YouTube-video</a>
                        <button class="nappi some-nappi" onclick="kopioiTeksti('some-${index}')">📋 Kopioi somepostaus</button>
                        
                        <h3>🎙️ 2 minuutin puhekäsikirjoitus äänitykseen:</h3>
                        <div class="tekstilaatikko">${leike.juonto}</div>
                        
                        <h3>📱 Valmis somepäivitys (TikTok / Insta / X):</h3>
                        <div class="tekstilaatikko some-laatikko" id="some-${index}">${lopullinenSome}</div>
                    `;
                    container.appendChild(div);
                });
            });

        function kopioiTeksti(elementId) {
            const teksti = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(teksti).then(() => {
                alert("Somepostaus kopioitu leikepöydälle! Voit nyt liittää sen suoraan someen. 🔥");
            }).catch(err => {
                console.error("Kopiointi epäonnistui: ", err);
            });
        }
    </script>
</body>
</html>
